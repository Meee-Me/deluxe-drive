<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Deluxe Drive">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef1ff" />
    </linearGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" stroke="#dde2f5" stroke-width="4" />

  <g filter="url(#drop)" transform="skewX(-12)">
    <rect x="169" y="148" width="250" height="62" rx="31" fill="url(#band1)" />
    <rect x="205" y="228" width="212" height="62" rx="31" fill="url(#band2)" />
    <rect x="241" y="308" width="174" height="62" rx="31" fill="url(#band3)" />
  </g>
</svg>
